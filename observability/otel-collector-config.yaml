# OpenTelemetry Collector for Agentgateway MCP traces and access logs.
# Traces: MCP observability guide (OTLP gRPC :4317 → Jaeger).
#   https://agentgateway.dev/docs/standalone/latest/documentation/mcp/mcp-observability/
# Logs: replace the guide's debug-only exporter with Loki (native OTLP HTTP).
#   https://agentgateway.dev/docs/standalone/latest/documentation/observability/access-logs/export/
#   https://grafana.com/docs/loki/latest/send-data/otel/
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # Agentgateway OTLP LogRecords have an empty body; attributes hold the fields.
  # Copy a short line into the body so Grafana's log list is readable.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(body, Concat(["protocol=", attributes["protocol"], " mcp.method.name=", attributes["mcp.method.name"], " http.path=", attributes["http.path"], " http.status=", attributes["http.status"], " duration=", attributes["duration"]], ""))

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Native Loki OTLP endpoint. otlphttp appends /v1/logs, so the base is /otlp.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/logs, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
