# Scrapes Agentgateway /metrics for Prometheus.
# Official standalone example uses host.docker.internal:15020:
# https://agentgateway.dev/docs/standalone/latest/documentation/observability/metrics/prometheus/
#
# Agentgateway is a normal Compose service and publishes :15020, so scrape
# the service name on the project bridge network.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: agentgateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - agentgateway:15020
