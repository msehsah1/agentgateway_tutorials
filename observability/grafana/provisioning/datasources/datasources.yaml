# Grafana datasources for Agentgateway MCP observability.
# Loki is the user-facing access-log UI (official OTLP export path).
# https://agentgateway.dev/docs/standalone/latest/documentation/observability/access-logs/export/
# https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/access-logs/view/
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
