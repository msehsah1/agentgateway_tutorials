config:
  enableIpv6: false
  database:
    url: sqlite:///data/data.db
  backend:
    connectTimeout: 5s
  tracing:
    otlpEndpoint: http://otel-collector:4317
    otlpProtocol: grpc
    randomSampling: true
    clientSampling: true
gateways:
  default:
    port: 4000
mcp:
  statefulMode: stateful
  prefixMode: never
  failureMode: failOpen
  policies:
    cors:
      allowOrigins:
        - '*'
      allowHeaders:
        - '*'
      exposeHeaders:
        - Mcp-Session-Id
    mcpAuthentication:
      mode: strict
      issuer: http://localhost:8080/realms/mcp
      audiences:
        - agentgateway
      jwks:
        url: http://keycloak:8080/realms/mcp/protocol/openid-connect/certs
      provider:
        keycloak: {}
      clientId: agentgateway
      resourceMetadata:
        resource: http://localhost:4000/mcp
        scopesSupported:
          - openid
        bearerMethodsSupported:
          - header
    authorization:
      rules:
        - '"mcp-admin" in jwt.realm_access.roles'
  targets:
    - name: postgres
      mcp:
        host: http://postgres-mcp:3000/mcp
frontendPolicies:
  accessLog:
    add:
      tool_args: mcp.tool.arguments
      tool_result: mcp.tool.result
      tool_error: mcp.tool.error
    otlp:
      host: otel-collector:4317
      protocol: grpc
ui:
  gateways: default
