# Agentgateway + Playwright MCP + self-hosted Firecrawl
#
# Clients reach MCP servers only through Agentgateway at http://127.0.0.1:4000/mcp
# Firecrawl API (optional direct smoke test): http://127.0.0.1:3002
# Host port publishes bind 127.0.0.1 only (same pattern as Prometheus :9090).
#
# Config lives next to each concern; this file is the only Compose project:
#   agentgateway/   config.yaml and SQLite data/
#   mcp/            Firecrawl MCP image
#   observability/  collector, Prometheus, Loki, Grafana
services:
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    shm_size: 2gb
    # --isolated: each MCP session gets its own in-memory browser profile.
    # Without it, playground + VS Code (or a leftover Chrome) share
    # mcp-chrome-for-testing-* and fail with "Browser is already in use".
    command:
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
      - --allowed-hosts
      - "*"
      - --isolated
    expose:
      - "8931"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({host:'127.0.0.1',port:8931},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Self-hosted Firecrawl (official Compose contract, GHCR images instead of a local build).
  # See https://docs.firecrawl.dev/contributing/self-host
  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    working_dir: /usr/src/app
    # Image default `pnpm start` downloads pnpm via Corepack on boot. Run the
    # compiled server directly so the container does not need npmjs.org.
    command: ["node", "dist/api.js"]
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    expose:
      - "3000"
    shm_size: 2gb
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({host:'127.0.0.1',port:3000},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-at-least-32-random-characters}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:2.11.162
    container_name: firecrawl-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-at-least-32-random-characters}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: "5432"
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-2}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-2}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
    command: ["node", "dist/src/harness.js", "--start-docker"]
    ports:
      - "127.0.0.1:3002:3002"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/v0/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-mcp:
    build:
      context: ./mcp/firecrawl-mcp
      dockerfile: Dockerfile
    image: firecrawl-mcp:local
    container_name: firecrawl-mcp
    restart: unless-stopped
    environment:
      HTTP_STREAMABLE_SERVER: "true"
      HOST: "0.0.0.0"
      PORT: "3000"
      FIRECRAWL_API_URL: http://firecrawl-api:3002
      FIRECRAWL_MCP_SEARCH_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      firecrawl-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # MCP observability backend from
  # https://agentgateway.dev/docs/standalone/latest/documentation/mcp/mcp-observability/
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14268:14268"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      - jaeger
      - loki

  # Loki + Grafana: official user-facing destination for OTLP access logs.
  # https://agentgateway.dev/docs/standalone/latest/documentation/observability/access-logs/export/
  # https://grafana.com/docs/loki/latest/setup/install/docker/
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:11.6.3
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus

  # Prometheus scrape of Agentgateway /metrics on the Compose service name.
  # https://agentgateway.dev/docs/standalone/latest/documentation/observability/metrics/prometheus/
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      agentgateway:
        condition: service_started

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    container_name: agentgateway
    restart: unless-stopped
    user: "${AGW_UID:-1000}:${AGW_GID:-1000}"
    volumes:
      - ./agentgateway/config.yaml:/config.yaml
      - ./agentgateway/data:/data
    command: ["-f", "/config.yaml"]
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:15020:15020"
    depends_on:
      playwright-mcp:
        condition: service_healthy
      firecrawl-mcp:
        condition: service_healthy
      otel-collector:
        condition: service_started
